<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - Gestion d'équipe</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* Enhanced login styles */
    .login-container {
      max-width: 450px;
      margin: 3rem auto;
      padding: 3rem;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border-radius: 1.5rem;
      box-shadow: 0 25px 100px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(148, 163, 184, 0.1);
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .login-form h2 {
      text-align: center;
      margin-bottom: 2rem;
      color: #f1f5f9;
      font-size: 2rem;
      font-weight: 700;
    }

    .login-form .form-control {
      margin-bottom: 0;
    }

    .login-form .form-control input {
      padding: 1rem;
      font-size: 1rem;
      border: 2px solid rgba(148, 163, 184, 0.2);
      transition: all 0.3s ease;
    }

    .login-form .form-control input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
      outline: none;
    }

    .login-form button {
      margin-top: 1rem;
      padding: 1rem;
      font-size: 1.1rem;
      font-weight: 600;
      position: relative;
      overflow: hidden;
    }

    .login-form button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .loading-spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid transparent;
      border-top: 2px solid #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 0.5rem;
    }

    .loading .loading-spinner {
      display: inline-block;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 1rem;
      border-radius: 0.75rem;
      font-size: 0.9rem;
      text-align: center;
      margin-top: 1rem;
      display: none;
    }

    .error-message.show {
      display: block;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .forgot-password {
      text-align: center;
      margin-top: 1.5rem;
    }

    .forgot-password a {
      color: #60a5fa;
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    .forgot-password a:hover {
      color: #93c5fd;
    }

    .register-link {
      text-align: center;
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid rgba(148, 163, 184, 0.2);
    }

    .register-link a {
      color: #10b981;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }

    .register-link a:hover {
      color: #34d399;
    }

    .demo-credentials {
      margin-top: 2rem;
      padding: 1.5rem;
      background: rgba(59, 130, 246, 0.05);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 1rem;
    }

    .demo-credentials h4 {
      margin: 0 0 1rem;
      color: #60a5fa;
      font-size: 0.9rem;
      text-align: center;
    }

    .demo-user {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem;
      margin: 0.5rem 0;
      background: rgba(15, 23, 42, 0.5);
      border-radius: 0.5rem;
      font-size: 0.85rem;
    }

    .demo-user .role {
      color: #94a3b8;
      font-weight: 600;
    }

    .demo-user .credentials {
      color: #cbd5e1;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="login-container">
      <form class="login-form" id="loginForm">
        <div style="text-align: center; margin-bottom: 2rem;">
          <img src="images/logo.jpg" alt="Logo La Parole Eternelle" class="app-logo-large">
          <h2>Connexion</h2>
          <p style="color: #94a3b8; margin: 0;">La Parole Eternelle - Kolwezi</p>
        </div>
        
        <div class="form-control">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>
        
        <div class="form-control">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        
        <button type="submit" class="primary" id="loginBtn">
          <span class="loading-spinner"></span>
          <span class="btn-text">Se connecter</span>
        </button>
        
        <div class="error-message" id="errorMessage"></div>
        
        <div class="forgot-password">
          <a href="forgot-password.html">Mot de passe oublié ?</a>
        </div>
      </form>
      
    </div>
  </div>

  <!-- Configuration Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>

  <!-- Services Supabase -->
  <script src="js/services/supabase-client.js"></script>
  <script src="js/services/auth.service.js"></script>
  <script src="js/services/profiles.service.js"></script>

  <script src="js/notifications.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Rediriger automatiquement si une session valide existe
      (async function autoRedirectIfLoggedIn() {
        try {
          const session = await window.authService.getSession();
          if (session) {
            const profile = await window.authService.getCurrentProfile();
            if (profile && profile.role) {
              const rolePages = {
                admin: 'admin.html',
                secretariat: 'secretariat.html',
                responsable: 'responsable.html',
                user: 'user.html'
              };
              const target = rolePages[profile.role];
              if (target) {
                window.location.href = target;
              }
            }
          }
        } catch (e) {
          console.warn('Impossible de vérifier la session existante:', e);
        }
      })();

      // Enhanced login functionality
      const loginForm = document.getElementById('loginForm');
      const loginBtn = document.getElementById('loginBtn');
      const errorMessage = document.getElementById('errorMessage');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');

      // Vérifier que le service est configuré
      async function checkServiceSetup() {
        if (!window.supabase || !window.SUPABASE_CONFIG) {
          console.warn('⚠️ Service non configuré');
          showError('Erreur de connexion au service. <a href="supabase-config.html" style="color: #60a5fa;">Configurer maintenant</a>');
          return false;
        }
        return true;
      }
      
      // Vérifier la configuration au chargement
      checkServiceSetup();

      function showError(message) {
        if (window.notificationSystem) {
          window.notificationSystem.error(message);
          return;
        }
        
        errorMessage.innerHTML = message;
        errorMessage.classList.add('show');
        setTimeout(() => {
          errorMessage.classList.remove('show');
        }, 5000);
      }

      function setLoading(loading) {
        loginBtn.classList.toggle('loading', loading);
        loginBtn.disabled = loading;
        if (loading) {
          loginBtn.querySelector('.btn-text').textContent = 'Connexion...';
        } else {
          loginBtn.querySelector('.btn-text').textContent = 'Se connecter';
        }
      }

      function redirectToRole(role) {
        const rolePages = {
          admin: 'admin.html',
          secretariat: 'secretariat.html',
          responsable: 'responsable.html',
          user: 'user.html'
        };
        
        window.location.href = rolePages[role] || 'user.html';
      }

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();
        
        if (!email || !password) {
          showError('Veuillez remplir tous les champs');
          return;
        }
        
        setLoading(true);
        
        try {
          // Connexion via le service d'authentification
          const { data, error } = await window.authService.signIn(email, password);
          
          if (error) {
            showError(error.message || 'Email ou mot de passe incorrect');
            setLoading(false);
            return;
          }
          
          // Récupérer le profil utilisateur
          const profile = await window.authService.getCurrentProfile();
          
          if (!profile) {
            showError('Profil utilisateur non trouvé. Contactez l\'administrateur.');
            setLoading(false);
            return;
          }
          
          // Check user status
          if (profile.status === 'pending') {
            showError('Votre compte est en attente d\'attribution de rôle par l\'administrateur. Veuillez patienter.');
            setLoading(false);
            return;
          }
          
          if (profile.status === 'inactive') {
            showError('Votre compte a été désactivé. Contactez l\'administrateur.');
            setLoading(false);
            return;
          }
          
          if (!profile.role) {
            showError('Aucun rôle attribué à votre compte. Contactez l\'administrateur.');
            setLoading(false);
            return;
          }
          
          // Success animation
          loginBtn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
          loginBtn.querySelector('.btn-text').textContent = 'Connexion réussie !';
          
          // Sauvegarder le rôle et les infos utilisateur dans localStorage
          localStorage.setItem('appRole', profile.role);
          localStorage.setItem('appUser', profile.username || email);
          localStorage.setItem('appUserName', profile.full_name || profile.username || email);
          if (profile.dept) {
            localStorage.setItem('appDept', profile.dept);
          }
          localStorage.setItem('appLoginTime', Date.now().toString());
          
          setTimeout(() => {
            redirectToRole(profile.role);
          }, 1000);
          
        } catch (error) {
          console.error('Erreur de connexion:', error);
          showError('Erreur de connexion. Veuillez réessayer.');
          setLoading(false);
        }
      });

      // Auto-focus email field
      emailInput.focus();

      // Clear error on input
      [emailInput, passwordInput].forEach(input => {
        input.addEventListener('input', () => {
          errorMessage.classList.remove('show');
        });
      });
    });
  </script>
</body>
</html>
