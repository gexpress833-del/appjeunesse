<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galerie Photos - La Parole Eternelle Kolwezi</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .photos-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    .photos-header {
      margin-bottom: 2rem;
      text-align: center;
    }

    .photos-header h1 {
      font-size: 2rem;
      font-family: "JetBrains Mono", monospace;
      margin-bottom: 0.5rem;
    }

    .photos-header p {
      color: var(--muted);
    }

    .upload-section {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 0.9rem;
      padding: 1.5rem;
      margin-bottom: 2rem;
      backdrop-filter: blur(8px);
    }

    .upload-section h2 {
      margin: 0 0 1rem;
      font-size: 1.2rem;
      font-family: "JetBrains Mono", monospace;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: var(--text-bright);
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 0.75rem;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 0.6rem;
      color: var(--text-bright);
      font-size: 0.9rem;
      box-sizing: border-box;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .file-input-wrapper {
      position: relative;
      margin-bottom: 1rem;
    }

    .file-input-wrapper input[type="file"] {
      width: 100%;
      padding: 0.75rem;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 0.6rem;
      color: var(--text-bright);
      font-size: 0.9rem;
      cursor: pointer;
    }

    .upload-btn {
      background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
      color: var(--text-bright);
      border-radius: 0.6rem;
      padding: 0.75rem 1.5rem;
      border: 1px solid var(--border-bright);
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .upload-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 212, 255, 0.3);
    }

    .upload-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .photo-card {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 0.9rem;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .photo-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0, 212, 255, 0.2);
    }

    .photo-image {
      width: 100%;
      height: 250px;
      object-fit: cover;
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(124, 58, 237, 0.1));
    }

    .photo-info {
      padding: 1rem;
    }

    .photo-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text-bright);
    }

    .photo-description {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 1rem;
      line-height: 1.5;
      max-height: 60px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .photo-actions {
      display: flex;
      gap: 0.5rem;
    }

    .download-btn {
      flex: 1;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 0.5rem;
      padding: 0.5rem 1rem;
      color: var(--text-bright);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
    }

    .download-btn:hover {
      background: rgba(0, 212, 255, 0.15);
      border-color: var(--accent);
      color: var(--accent);
    }

    .delete-btn {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 0.5rem;
      padding: 0.5rem 1rem;
      color: #ef4444;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .delete-btn:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: #ef4444;
    }

    .loading {
      text-align: center;
      padding: 2rem;
      color: var(--muted);
    }

    .error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 0.6rem;
      padding: 1rem;
      color: #ef4444;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }

    .success {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: 0.6rem;
      padding: 1rem;
      color: #22c55e;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }

    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--muted);
    }

    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    @media (max-width: 640px) {
      .photos-container {
        padding: 1rem;
      }

      .gallery-grid {
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 1rem;
      }

      .photo-image {
        height: 200px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="home-logo-wrapper">
        <a href="index.html">
          <img src="logo.svg" alt="Logo Espace Jeunesse" />
        </a>
      </div>
      <div class="header-center">
        <h1 class="header-title">Espace Jeunesse</h1>
        <span class="welcome-message">Une génération qui sert Dieu avec excellence</span>
      </div>
      <div class="login-panel">
        <a href="index.html" class="btn-primary">🏠 Accueil</a>
      </div>
    </header>

    <div class="photos-container">
      <div class="photos-header">
        <h1>📸 Galerie Photos</h1>
        <p>Partagez et téléchargez les moments de la jeunesse</p>
      </div>

      <div class="upload-section">
        <h2>Ajouter une photo</h2>
        <div id="uploadError" class="error" style="display: none;"></div>
        <div id="uploadSuccess" class="success" style="display: none;"></div>
        <form id="uploadForm">
          <div class="form-group">
            <label for="photoTitle">Titre *</label>
            <input type="text" id="photoTitle" required placeholder="Titre de la photo" />
          </div>
          <div class="form-group">
            <label for="photoDescription">Description</label>
            <textarea id="photoDescription" placeholder="Description de la photo (optionnel)"></textarea>
          </div>
          <div class="file-input-wrapper">
            <label for="photoFile">Image *</label>
            <input type="file" id="photoFile" accept="image/*" required />
          </div>
          <button type="submit" class="upload-btn" id="uploadBtn">
            <span>☁️</span> Téléverser
          </button>
        </form>
      </div>

      <div id="loading" class="loading" style="display: none;">
        Chargement des photos...
      </div>

      <div id="emptyState" class="empty-state" style="display: none;">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
        <p>Aucune photo pour le moment</p>
      </div>

      <div id="gallery" class="gallery-grid"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script>
    // Variables globales
    let photosChannel = null;
    let CLOUDINARY_UPLOAD_PRESET = '';
    let CLOUDINARY_CLOUD_NAME = '';

    // Fonction pour charger la configuration Supabase et Cloudinary
    async function loadConfig() {
      try {
        const config = window.APP_CONFIG;
        if (!config) {
          throw new Error('Configuration Supabase non trouvée');
        }
        
        // Configurer Cloudinary
        CLOUDINARY_CLOUD_NAME = config.cloudinaryCloudName;
        CLOUDINARY_UPLOAD_PRESET = config.cloudinaryUploadPreset;
        
        if (!CLOUDINARY_CLOUD_NAME || !CLOUDINARY_UPLOAD_PRESET) {
          console.warn('Configuration Cloudinary incomplète');
        }
        
        return config;
      } catch (error) {
        console.error('Erreur lors du chargement de la configuration:', error);
        showError('Erreur de configuration. Veuillez contacter l\'administrateur.');
        return null;
      }
    }

    // Fonction pour afficher une erreur
    function showError(message) {
      const errorDiv = document.getElementById('uploadError');
      errorDiv.textContent = message;
      errorDiv.style.display = 'block';
      setTimeout(() => {
        errorDiv.style.display = 'none';
      }, 5000);
    }

    // Fonction pour afficher un succès
    function showSuccess(message) {
      const successDiv = document.getElementById('uploadSuccess');
      successDiv.textContent = message;
      successDiv.style.display = 'block';
      setTimeout(() => {
        successDiv.style.display = 'none';
      }, 3000);
    }

    // Fonction pour uploader vers Cloudinary (API REST unsigned)
    async function uploadToCloudinary(file) {
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

      const response = await fetch(
        `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
        {
          method: 'POST',
          body: formData
        }
      );

      if (!response.ok) {
        const error = await response.json();
        throw new Error(error.error?.message || 'Erreur lors de l\'upload');
      }

      const data = await response.json();
      return {
        secure_url: data.secure_url,
        public_id: data.public_id
      };
    }

    // Fonction pour créer une URL de téléchargement avec fl_attachment
    function getDownloadUrl(cloudinaryUrl) {
      // Insérer fl_attachment avant le nom du fichier
      const url = new URL(cloudinaryUrl);
      const pathParts = url.pathname.split('/');
      const uploadIndex = pathParts.indexOf('upload');
      
      if (uploadIndex !== -1) {
        // Insérer fl_attachment après 'upload'
        pathParts.splice(uploadIndex + 1, 0, 'fl_attachment');
        url.pathname = pathParts.join('/');
      }
      
      return url.toString();
    }

    // Fonction pour créer une carte de photo
    function createPhotoCard(photo) {
      const card = document.createElement('div');
      card.className = 'photo-card';
      
      const downloadUrl = getDownloadUrl(photo.image_url);
      
      card.innerHTML = `
        <img src="${photo.image_url}" alt="${escapeHtml(photo.title)}" class="photo-image" loading="lazy" />
        <div class="photo-info">
          <h3 class="photo-title">${escapeHtml(photo.title)}</h3>
          <p class="photo-description">${escapeHtml(photo.description || '')}</p>
          <div class="photo-actions">
            <a href="${downloadUrl}" download class="download-btn">
              <span>⬇️</span> Télécharger
            </a>
            <button class="delete-btn" onclick="deletePhoto('${photo.id}', '${photo.cloudinary_public_id}')">
              🗑️
            </button>
          </div>
        </div>
      `;
      
      return card;
    }

    // Fonction de nettoyage HTML pour protéger contre XSS
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Fonction pour charger les photos depuis Supabase
    async function loadPhotos() {
      const loading = document.getElementById('loading');
      const gallery = document.getElementById('gallery');
      const emptyState = document.getElementById('emptyState');
      
      loading.style.display = 'block';
      gallery.innerHTML = '';
      
      try {
        const supabase = window.supabaseDB?.getClient();
        if (!supabase) {
          throw new Error('Client Supabase non initialisé');
        }

        const { data: photos, error } = await supabase
          .from('photos')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        loading.style.display = 'none';

        if (photos.length === 0) {
          emptyState.style.display = 'block';
          return;
        }

        emptyState.style.display = 'none';
        photos.forEach(photo => {
          gallery.appendChild(createPhotoCard(photo));
        });
      } catch (error) {
        console.error('Erreur lors du chargement des photos:', error);
        loading.style.display = 'none';
        showError('Erreur lors du chargement des photos');
      }
    }

    // Fonction pour supprimer une photo
    async function deletePhoto(photoId, publicId) {
      if (!confirm('Êtes-vous sûr de vouloir supprimer cette photo ?')) {
        return;
      }

      try {
        const supabase = window.supabaseDB?.getClient();
        if (!supabase) {
          throw new Error('Client Supabase non initialisé');
        }

        // Supprimer de Supabase
        const { error } = await supabase
          .from('photos')
          .delete()
          .eq('id', photoId);

        if (error) throw error;

        // Supprimer de Cloudinary (nécessite une signature côté serveur)
        // Pour l'instant, on supprime seulement de la base de données
        showSuccess('Photo supprimée avec succès');
      } catch (error) {
        console.error('Erreur lors de la suppression:', error);
        showError('Erreur lors de la suppression de la photo');
      }
    }

    // Fonction pour s'abonner aux changements Realtime
    function subscribeToPhotos() {
      const supabase = window.supabaseDB?.getClient();
      if (!supabase) return;

      photosChannel = supabase
        .channel('photos-channel')
        .on(
          'postgres_changes',
          {
            event: '*',
            schema: 'public',
            table: 'photos'
          },
          (payload) => {
            console.log('Changement détecté:', payload);
            loadPhotos(); // Recharger la galerie
          }
        )
        .subscribe((status) => {
          if (status === 'SUBSCRIBED') {
            console.log('Abonné aux changements de photos');
          } else if (status === 'SUBSCRIPTION_ERROR') {
            console.error('Erreur d\'abonnement aux photos');
          }
        });
    }

    // Gestion du formulaire d'upload
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const uploadBtn = document.getElementById('uploadBtn');
      const title = document.getElementById('photoTitle').value;
      const description = document.getElementById('photoDescription').value;
      const fileInput = document.getElementById('photoFile');
      const file = fileInput.files[0];

      if (!file) {
        showError('Veuillez sélectionner une image');
        return;
      }

      uploadBtn.disabled = true;
      uploadBtn.innerHTML = '<span>⏳</span> Téléversement en cours...';

      try {
        // Uploader vers Cloudinary
        const cloudinaryData = await uploadToCloudinary(file);

        // Sauvegarder dans Supabase
        const supabase = window.supabaseDB?.getClient();
        if (!supabase) {
          throw new Error('Client Supabase non initialisé');
        }

        const { error } = await supabase
          .from('photos')
          .insert({
            title: title,
            description: description,
            image_url: cloudinaryData.secure_url,
            cloudinary_public_id: cloudinaryData.public_id
          });

        if (error) throw error;

        showSuccess('Photo téléversée avec succès !');
        document.getElementById('uploadForm').reset();
      } catch (error) {
        console.error('Erreur lors de l\'upload:', error);
        showError(error.message || 'Erreur lors du téléversement');
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.innerHTML = '<span>☁️</span> Téléverser';
      }
    });

    // Initialisation
    document.addEventListener('DOMContentLoaded', async () => {
      const config = await loadConfig();
      if (config) {
        await loadPhotos();
        subscribeToPhotos();
      }
    });

    // Nettoyage lors de la fermeture de la page
    window.addEventListener('beforeunload', () => {
      if (photosChannel) {
        photosChannel.unsubscribe();
      }
    });
  </script>
</body>
</html>
