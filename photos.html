<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galerie Photos - La Parole Eternelle Kolwezi</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .photos-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    .photos-header {
      margin-bottom: 2rem;
      text-align: center;
    }

    .photos-header h1 {
      font-size: 2rem;
      font-family: "JetBrains Mono", monospace;
      margin-bottom: 0.5rem;
    }

    .photos-header p {
      color: var(--muted);
    }

    .upload-section {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 0.9rem;
      padding: 1.5rem;
      margin-bottom: 2rem;
      backdrop-filter: blur(8px);
    }

    .upload-section h2 {
      margin: 0 0 1rem;
      font-size: 1.2rem;
      font-family: "JetBrains Mono", monospace;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: var(--text-bright);
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 0.75rem;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 0.6rem;
      color: var(--text-bright);
      font-size: 0.9rem;
      box-sizing: border-box;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .file-input-wrapper {
      position: relative;
      margin-bottom: 1rem;
    }

    .file-input-wrapper input[type="file"] {
      width: 100%;
      padding: 0.75rem;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 0.6rem;
      color: var(--text-bright);
      font-size: 0.9rem;
      cursor: pointer;
    }

    .upload-btn {
      background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
      color: var(--text-bright);
      border-radius: 0.6rem;
      padding: 0.75rem 1.5rem;
      border: 1px solid var(--border-bright);
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .upload-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 212, 255, 0.3);
    }

    .upload-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .photo-card {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 0.9rem;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .photo-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0, 212, 255, 0.2);
    }

    .photo-image {
      width: 100%;
      height: 250px;
      object-fit: cover;
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(124, 58, 237, 0.1));
    }

    .photo-info {
      padding: 1rem;
    }

    .photo-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text-bright);
    }

    .photo-description {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 1rem;
      line-height: 1.5;
      max-height: 60px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .photo-actions {
      display: flex;
      gap: 0.5rem;
    }

    .download-btn {
      flex: 1;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 0.5rem;
      padding: 0.5rem 1rem;
      color: var(--text-bright);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
    }

    .download-btn:hover {
      background: rgba(0, 212, 255, 0.15);
      border-color: var(--accent);
      color: var(--accent);
    }

    .delete-btn {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 0.5rem;
      padding: 0.5rem 1rem;
      color: #ef4444;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .delete-btn:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: #ef4444;
    }

    .loading {
      text-align: center;
      padding: 2rem;
      color: var(--muted);
    }

    .error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 0.6rem;
      padding: 1rem;
      color: #ef4444;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }

    .success {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: 0.6rem;
      padding: 1rem;
      color: #22c55e;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }

    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--muted);
    }

    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 0.5rem;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
      border-radius: 4px;
      transition: width 0.3s ease;
      width: 0%;
    }

    .event-section {
      margin-bottom: 2rem;
    }

    .event-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      padding: 1rem;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 0.75rem;
      backdrop-filter: blur(8px);
    }

    .event-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-bright);
    }

    .event-count {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .search-section {
      margin-bottom: 2rem;
      padding: 1rem;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 0.75rem;
      backdrop-filter: blur(8px);
    }

    .search-input {
      width: 100%;
      padding: 0.75rem;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 0.6rem;
      color: var(--text-bright);
      font-size: 0.9rem;
      box-sizing: border-box;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .event-filter {
      margin-top: 1rem;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .event-filter-btn {
      padding: 0.5rem 1rem;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 0.5rem;
      color: var(--text-bright);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .event-filter-btn:hover {
      background: rgba(0, 212, 255, 0.15);
      border-color: var(--accent);
    }

    .event-filter-btn.active {
      background: rgba(0, 212, 255, 0.2);
      border-color: var(--accent);
      color: var(--accent);
    }

    @media (max-width: 640px) {
      .photos-container {
        padding: 1rem;
      }

      .gallery-grid {
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 1rem;
      }

      .photo-image {
        height: 200px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="home-logo-wrapper">
        <a href="index.html">
          <img src="logo.svg" alt="Logo Espace Jeunesse" />
        </a>
      </div>
      <div class="header-center">
        <h1 class="header-title">Espace Jeunesse</h1>
        <span class="welcome-message">Une génération qui sert Dieu avec excellence</span>
      </div>
      <div class="login-panel">
        <a href="index.html" class="btn-primary">🏠 Accueil</a>
      </div>
    </header>

    <div class="photos-container">
      <div class="photos-header">
        <h1>📸 Galerie Photos</h1>
        <p>Partagez et téléchargez les moments de la jeunesse</p>
      </div>

      <div class="upload-section">
        <h2>Ajouter des photos</h2>
        <div id="uploadError" class="error" style="display: none;"></div>
        <div id="uploadSuccess" class="success" style="display: none;"></div>
        <form id="uploadForm">
          <div class="form-group">
            <label for="photoEventName">Événement *</label>
            <input type="text" id="photoEventName" required placeholder="ex: Retraite Spirituelle 2024" />
          </div>
          <div class="form-group">
            <label for="photoTitle">Titre par défaut (optionnel)</label>
            <input type="text" id="photoTitle" placeholder="Si vide, utilise le nom de l'événement" />
          </div>
          <div class="form-group">
            <label for="photoDescription">Description (optionnel)</label>
            <textarea id="photoDescription" placeholder="Description des photos (optionnel)"></textarea>
          </div>
          <div class="file-input-wrapper">
            <label for="photoFile">Images *</label>
            <input type="file" id="photoFile" accept="image/*" multiple required />
            <small style="color: var(--muted); font-size: 0.8rem;">Vous pouvez sélectionner plusieurs fichiers</small>
          </div>
          <div id="uploadProgress" style="display: none;">
            <div class="progress-bar">
              <div class="progress-fill" id="progressFill"></div>
            </div>
            <p id="progressText" style="color: var(--muted); font-size: 0.85rem; margin-top: 0.5rem;">0 / 0 photos téléversées</p>
          </div>
          <button type="submit" class="upload-btn" id="uploadBtn">
            <span>☁️</span> Téléverser les photos
          </button>
        </form>
      </div>

      <div id="loading" class="loading" style="display: none;">
        Chargement des photos...
      </div>

      <div id="emptyState" class="empty-state" style="display: none;">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
        <p>Aucune photo pour le moment</p>
      </div>

      <div class="search-section">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Rechercher par événement..." />
        <div class="event-filter" id="eventFilter">
          <button class="event-filter-btn active" data-event="all">Tous</button>
        </div>
      </div>

      <div id="gallery"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script>
    // Variables globales
    let photosChannel = null;
    let CLOUDINARY_UPLOAD_PRESET = '';
    let CLOUDINARY_CLOUD_NAME = '';
    let allPhotos = [];
    let currentEventFilter = 'all';

    // Fonction pour charger la configuration Supabase et Cloudinary
    async function loadConfig() {
      try {
        const config = window.APP_CONFIG;
        if (!config) {
          throw new Error('Configuration Supabase non trouvée');
        }
        
        // Configurer Cloudinary
        CLOUDINARY_CLOUD_NAME = config.cloudinaryCloudName;
        CLOUDINARY_UPLOAD_PRESET = config.cloudinaryUploadPreset;
        
        if (!CLOUDINARY_CLOUD_NAME || !CLOUDINARY_UPLOAD_PRESET) {
          console.warn('Configuration Cloudinary incomplète');
        }
        
        return config;
      } catch (error) {
        console.error('Erreur lors du chargement de la configuration:', error);
        showError('Erreur de configuration. Veuillez contacter l\'administrateur.');
        return null;
      }
    }

    // Fonction pour afficher une erreur
    function showError(message) {
      const errorDiv = document.getElementById('uploadError');
      errorDiv.textContent = message;
      errorDiv.style.display = 'block';
      setTimeout(() => {
        errorDiv.style.display = 'none';
      }, 5000);
    }

    // Fonction pour afficher un succès
    function showSuccess(message) {
      const successDiv = document.getElementById('uploadSuccess');
      successDiv.textContent = message;
      successDiv.style.display = 'block';
      setTimeout(() => {
        successDiv.style.display = 'none';
      }, 3000);
    }

    // Fonction pour uploader vers Cloudinary (API REST unsigned)
    async function uploadToCloudinary(file) {
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

      const response = await fetch(
        `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
        {
          method: 'POST',
          body: formData
        }
      );

      if (!response.ok) {
        const error = await response.json();
        throw new Error(error.error?.message || 'Erreur lors de l\'upload');
      }

      const data = await response.json();
      return {
        secure_url: data.secure_url,
        public_id: data.public_id
      };
    }

    // Fonction pour créer une URL de téléchargement avec fl_attachment
    function getDownloadUrl(cloudinaryUrl) {
      // Insérer fl_attachment avant le nom du fichier
      const url = new URL(cloudinaryUrl);
      const pathParts = url.pathname.split('/');
      const uploadIndex = pathParts.indexOf('upload');
      
      if (uploadIndex !== -1) {
        // Insérer fl_attachment après 'upload'
        pathParts.splice(uploadIndex + 1, 0, 'fl_attachment');
        url.pathname = pathParts.join('/');
      }
      
      return url.toString();
    }

    // Fonction pour créer une carte de photo
    function createPhotoCard(photo) {
      const card = document.createElement('div');
      card.className = 'photo-card';
      
      const downloadUrl = getDownloadUrl(photo.image_url);
      
      card.innerHTML = `
        <img src="${photo.image_url}" alt="${escapeHtml(photo.title)}" class="photo-image" loading="lazy" />
        <div class="photo-info">
          <h3 class="photo-title">${escapeHtml(photo.title)}</h3>
          <p class="photo-description">${escapeHtml(photo.description || '')}</p>
          <div class="photo-actions">
            <a href="${downloadUrl}" download class="download-btn">
              <span>⬇️</span> Télécharger
            </a>
            <button class="delete-btn" onclick="deletePhoto('${photo.id}', '${photo.cloudinary_public_id}')">
              🗑️
            </button>
          </div>
        </div>
      `;
      
      return card;
    }

    // Fonction pour regrouper les photos par événements
    function groupPhotosByEvent(photos) {
      const grouped = {};
      
      photos.forEach(photo => {
        const eventName = photo.event_name || 'Sans événement';
        if (!grouped[eventName]) {
          grouped[eventName] = [];
        }
        grouped[eventName].push(photo);
      });
      
      return grouped;
    }

    // Fonction pour afficher les photos regroupées par événements
    function renderPhotosByEvents(photos) {
      const gallery = document.getElementById('gallery');
      const emptyState = document.getElementById('emptyState');
      
      if (photos.length === 0) {
        gallery.innerHTML = '';
        emptyState.style.display = 'block';
        return;
      }
      
      emptyState.style.display = 'none';
      gallery.innerHTML = '';
      
      const grouped = groupPhotosByEvent(photos);
      const eventNames = Object.keys(grouped).sort((a, b) => {
        // Mettre "Sans événement" à la fin
        if (a === 'Sans événement') return 1;
        if (b === 'Sans événement') return -1;
        return a.localeCompare(b);
      });
      
      eventNames.forEach(eventName => {
        const eventPhotos = grouped[eventName];
        const eventSection = document.createElement('div');
        eventSection.className = 'event-section';
        
        eventSection.innerHTML = `
          <div class="event-header">
            <h3 class="event-title">📅 ${escapeHtml(eventName)}</h3>
            <span class="event-count">${eventPhotos.length} photo${eventPhotos.length > 1 ? 's' : ''}</span>
          </div>
          <div class="gallery-grid"></div>
        `;
        
        const grid = eventSection.querySelector('.gallery-grid');
        eventPhotos.forEach(photo => {
          grid.appendChild(createPhotoCard(photo));
        });
        
        gallery.appendChild(eventSection);
      });
    }

    // Fonction pour mettre à jour les filtres d'événements
    function updateEventFilters(photos) {
      const eventFilter = document.getElementById('eventFilter');
      const events = [...new Set(photos.map(p => p.event_name || 'Sans événement'))].sort();
      
      eventFilter.innerHTML = '<button class="event-filter-btn active" data-event="all">Tous</button>';
      
      events.forEach(eventName => {
        const btn = document.createElement('button');
        btn.className = 'event-filter-btn';
        btn.dataset.event = eventName;
        btn.textContent = eventName;
        eventFilter.appendChild(btn);
      });
      
      // Ajouter les écouteurs d'événements
      eventFilter.querySelectorAll('.event-filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          eventFilter.querySelectorAll('.event-filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentEventFilter = btn.dataset.event;
          filterPhotos();
        });
      });
    }

    // Fonction pour filtrer les photos
    function filterPhotos() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      
      let filtered = allPhotos;
      
      // Filtrer par événement
      if (currentEventFilter !== 'all') {
        filtered = filtered.filter(p => (p.event_name || 'Sans événement') === currentEventFilter);
      }
      
      // Filtrer par recherche
      if (searchTerm) {
        filtered = filtered.filter(p => 
          (p.event_name || '').toLowerCase().includes(searchTerm) ||
          (p.title || '').toLowerCase().includes(searchTerm) ||
          (p.description || '').toLowerCase().includes(searchTerm)
        );
      }
      
      renderPhotosByEvents(filtered);
    }

    // Fonction de nettoyage HTML pour protéger contre XSS
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Fonction pour charger les photos depuis Supabase
    async function loadPhotos() {
      const loading = document.getElementById('loading');
      
      loading.style.display = 'block';
      
      try {
        const { data, error } = await window.supabase
          .from('photos')
          .select('*')
          .order('created_at', { ascending: false });
        
        if (error) throw error;
        
        loading.style.display = 'none';
        
        allPhotos = data || [];
        updateEventFilters(allPhotos);
        renderPhotosByEvents(allPhotos);
        
      } catch (error) {
        console.error('Erreur lors du chargement des photos:', error);
        loading.style.display = 'none';
        showError('Erreur lors du chargement des photos');
      }
    }

    // Fonction pour supprimer une photo
    async function deletePhoto(photoId, publicId) {
      if (!confirm('Êtes-vous sûr de vouloir supprimer cette photo ?')) {
        return;
      }

      try {
        const supabase = window.supabaseDB?.getClient();
        if (!supabase) {
          throw new Error('Client Supabase non initialisé');
        }

        // Supprimer de Supabase
        const { error } = await supabase
          .from('photos')
          .delete()
          .eq('id', photoId);

        if (error) throw error;

        // Supprimer de Cloudinary (nécessite une signature côté serveur)
        // Pour l'instant, on supprime seulement de la base de données
        showSuccess('Photo supprimée avec succès');
      } catch (error) {
        console.error('Erreur lors de la suppression:', error);
        showError('Erreur lors de la suppression de la photo');
      }
    }

    // Fonction pour s'abonner aux changements Realtime
    function subscribeToPhotos() {
      const supabase = window.supabaseDB?.getClient();
      if (!supabase) return;

      photosChannel = supabase
        .channel('photos-channel')
        .on(
          'postgres_changes',
          {
            event: '*',
            schema: 'public',
            table: 'photos'
          },
          (payload) => {
            console.log('Changement détecté:', payload);
            loadPhotos(); // Recharger la galerie
          }
        )
        .subscribe((status) => {
          if (status === 'SUBSCRIBED') {
            console.log('Abonné aux changements de photos');
          } else if (status === 'SUBSCRIPTION_ERROR') {
            console.error('Erreur d\'abonnement aux photos');
          }
        });
    }

    // Gestion du formulaire d'upload
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const uploadBtn = document.getElementById('uploadBtn');
      const eventName = document.getElementById('photoEventName').value.trim();
      const defaultTitle = document.getElementById('photoTitle').value.trim();
      const description = document.getElementById('photoDescription').value.trim();
      const fileInput = document.getElementById('photoFile');
      const files = Array.from(fileInput.files);

      if (!eventName) {
        showError('Veuillez entrer un nom d\'événement');
        return;
      }

      if (files.length === 0) {
        showError('Veuillez sélectionner au moins une image');
        return;
      }

      const uploadProgress = document.getElementById('uploadProgress');
      const progressFill = document.getElementById('progressFill');
      const progressText = document.getElementById('progressText');
      
      uploadProgress.style.display = 'block';
      uploadBtn.disabled = true;
      uploadBtn.innerHTML = '<span>⏳</span> Téléversement en cours...';

      let uploadedCount = 0;
      let errorCount = 0;
      const totalFiles = files.length;

      try {
        const supabase = window.supabaseDB?.getClient();
        if (!supabase) {
          throw new Error('Client Supabase non initialisé');
        }

        // Uploader chaque fichier
        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          const fileTitle = defaultTitle || eventName;
          
          try {
            // Uploader vers Cloudinary
            const cloudinaryData = await uploadToCloudinary(file);

            // Sauvegarder dans Supabase
            const { error } = await supabase
              .from('photos')
              .insert({
                title: fileTitle,
                description: description,
                image_url: cloudinaryData.secure_url,
                cloudinary_public_id: cloudinaryData.public_id,
                event_name: eventName,
                event_id: eventName.toLowerCase().replace(/\s+/g, '-')
              });

            if (error) throw error;
            
            uploadedCount++;
          } catch (fileError) {
            console.error(`Erreur pour le fichier ${file.name}:`, fileError);
            errorCount++;
          }

          // Mettre à jour la progression
          const progress = ((i + 1) / totalFiles) * 100;
          progressFill.style.width = `${progress}%`;
          progressText.textContent = `${uploadedCount + errorCount} / ${totalFiles} photos traitées`;
        }

        uploadProgress.style.display = 'none';
        
        if (uploadedCount > 0) {
          showSuccess(`${uploadedCount} photo${uploadedCount > 1 ? 's' : ''} téléversée${uploadedCount > 1 ? 's' : ''} avec succès pour l'événement "${eventName}"!`);
          document.getElementById('uploadForm').reset();
          await loadPhotos();
        }
        
        if (errorCount > 0) {
          showError(`${errorCount} photo${errorCount > 1 ? 's' : ''} n'ont${errorCount > 1 ? ' pas' : 'a pas'} pu être téléversée${errorCount > 1 ? 's' : ''}`);
        }
      } catch (error) {
        console.error('Erreur lors de l\'upload:', error);
        showError(error.message || 'Erreur lors du téléversement');
        uploadProgress.style.display = 'none';
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.innerHTML = '<span>☁️</span> Téléverser les photos';
      }
    });

    // Initialisation
    document.addEventListener('DOMContentLoaded', async () => {
      const config = await loadConfig();
      if (config) {
        await loadPhotos();
        subscribeToPhotos();
      }
      
      // Ajouter l'écouteur pour la recherche
      document.getElementById('searchInput').addEventListener('input', filterPhotos);
    });

    // Nettoyage lors de la fermeture de la page
    window.addEventListener('beforeunload', () => {
      if (photosChannel) {
        photosChannel.unsubscribe();
      }
    });
  </script>
</body>
</html>
